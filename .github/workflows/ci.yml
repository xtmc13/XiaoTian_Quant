name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel redundant workflows on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Go Backend ──
  go-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - run: go mod download
      - run: go build ./cmd/server
      - run: go vet ./...
      - run: go test ./internal/... -race -count=1

  # ── Rust Matching Engine ──
  rust-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity

  # ── Production Go↔Rust CGo path ──
  rust-cgo-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            cc: gcc
            test: true
            ext: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            test: false
            ext: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            cc: clang
            test: true
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            cc: clang
            test: true
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            goos: windows
            goarch: amd64
            cc: gcc
            test: true
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - name: Install MinGW (Windows)
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 cross linker
        if: matrix.goarch == 'arm64' && matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build Rust shared library
        working-directory: ./engine
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Test Go adapter and OMS integration with Rust
        if: matrix.test
        working-directory: ./gateway
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        shell: bash
        run: |
          set -euo pipefail
          RUST_LIB_PATH="$GITHUB_WORKSPACE/engine/target/${{ matrix.target }}/release"
          if [[ "${{ runner.os }}" == Windows ]]; then
            RUST_LIB_PATH="$(cygpath -u "$RUST_LIB_PATH")"
            export PATH="$RUST_LIB_PATH:$PATH"
          elif [[ "${{ runner.os }}" == macOS ]]; then
            export DYLD_LIBRARY_PATH="$RUST_LIB_PATH${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          else
            export LD_LIBRARY_PATH="$RUST_LIB_PATH${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          CGO_LDFLAGS="-L$RUST_LIB_PATH" go test -tags xtengine \
            ./internal/adapter ./internal/service -count=1
      - name: Build production gateway with Rust matcher
        working-directory: ./gateway
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        shell: bash
        run: |
          set -euo pipefail
          RUST_LIB_PATH="$GITHUB_WORKSPACE/engine/target/${{ matrix.target }}/release"
          GATEWAY_OUT="$RUNNER_TEMP/gateway${{ matrix.ext }}"
          if [[ "${{ runner.os }}" == Windows ]]; then
            RUST_LIB_PATH="$(cygpath -u "$RUST_LIB_PATH")"
            GATEWAY_OUT="$(cygpath -u "$GATEWAY_OUT")"
          fi
          CGO_LDFLAGS="-L$RUST_LIB_PATH" go build -tags xtengine \
            -o "$GATEWAY_OUT" \
            ./cmd/server

  # ── Frontend ──
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test -- --run

  # ── Docker Build ──
  docker:
    runs-on: ubuntu-latest
    needs: [go-build, rust-build, rust-cgo-integration, web-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        # The Dockerfile is in the repo root, use root as context
        # Rust engine is built inside the Dockerfile (stage 0)
        run: |
          docker build -t xiaotian-gateway:latest \
            --build-arg VERSION=${{ github.sha }} \
            -f Dockerfile .
      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config

  # ── Security Scan ──
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go vulnerability scan
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - run: |
          cd gateway
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Node production dependency audit
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && npm audit --omit=dev --audit-level=moderate

  # ── Deploy (main 推送；SSH 到生产目录 Compose 重建) ──
  # 前置：在 GitHub Environment(production) 或仓库 Secrets 配置：
  #   DEPLOY_HOST      生产 IP/域名（未配置则整个 deploy job 跳过，不报错）
  #   DEPLOY_SSH_KEY   可登录生产的 SSH 私钥（PEM）
  #   DEPLOY_USER      SSH 用户，缺省 root
  #   DEPLOY_PORT      SSH 端口，缺省 22
  #   DEPLOY_PATH      生产仓库目录（含 .env 与 compose 文件）
  #   DEPLOY_COMPOSE_FILE  compose 文件，缺省 docker-compose.prod.yml
  # .env 由生产侧保留、不随 git 下发；必须含非空 SECRET_KEY（空密钥会跳过迁移、JWT 瘫痪）。
  deploy:
    runs-on: ubuntu-latest
    needs: [go-build, rust-build, web-build, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.DEPLOY_HOST != ''
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE || 'docker-compose.prod.yml' }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Deploy over SSH
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail; cd '${DEPLOY_PATH}'; \
             test -f .env || { echo '生产目录缺 .env，中止部署'; exit 1; }; \
             grep -q '^SECRET_KEY=.\+' .env || { echo '.env 未设置非空 SECRET_KEY，中止（空密钥会跳过迁移、JWT 瘫痪）'; exit 1; }; \
             git fetch --force origin main; git reset --hard origin/main; \
             docker compose --env-file .env -f '${DEPLOY_COMPOSE_FILE}' up -d --build; \
             docker compose --env-file .env -f '${DEPLOY_COMPOSE_FILE}' ps"
      - name: Health check
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8080/api/health; then echo; exit 0; fi; sleep 2; done; echo "health check timed out"; exit 1'
