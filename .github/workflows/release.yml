name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.0.0)'
        required: true
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  # ── Build Frontend ──
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # ── Build Rust Engine ──
  build-engine:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            cross_linker: gcc-aarch64-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW (Windows)
        if: matrix.name == 'windows-amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linker (linux/arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_linker }}
      - name: Build engine
        working-directory: ./engine
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.name }}
          # Cargo.toml [lib] name = xt_matching → libxt_matching.{so,dylib} / xt_matching.dll
          path: |
            engine/target/${{ matrix.target }}/release/libxt_matching.*
            engine/target/${{ matrix.target }}/release/xt_matching.dll
          if-no-files-found: error

  # ── Build Go Backend ──
  build-gateway:
    needs: [build-web, build-engine]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            target: x86_64-unknown-linux-gnu
            name: linux-amd64
            ext: ''
            cc: gcc
            rpath: '-Wl,-rpath,$ORIGIN'
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ''
            cc: aarch64-linux-gnu-gcc
            rpath: '-Wl,-rpath,$ORIGIN'
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            target: x86_64-apple-darwin
            name: macos-amd64
            ext: ''
            cc: clang
            rpath: '-Wl,-rpath,@loader_path'
          - os: macos-latest
            goos: darwin
            goarch: arm64
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ''
            cc: clang
            rpath: '-Wl,-rpath,@loader_path'
          - os: windows-latest
            goos: windows
            goarch: amd64
            target: x86_64-pc-windows-gnu
            name: windows-amd64
            ext: '.exe'
            cc: gcc
            rpath: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW (Windows)
        if: matrix.name == 'windows-amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Install cross linker (linux/arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.name }}
          path: gateway/engine_lib
      - name: Build Rust-linked Go binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          set -euo pipefail
          cd gateway
          mkdir -p spa
          cp -r ../web/dist/. spa/
          RPATH='${{ matrix.rpath }}'
          ENGINE_LIB_PATH="$GITHUB_WORKSPACE/gateway/engine_lib"
          if [[ "${{ runner.os }}" == Windows ]]; then
            ENGINE_LIB_PATH="$(cygpath -u "$ENGINE_LIB_PATH")"
          fi
          CGO_LDFLAGS="-L$ENGINE_LIB_PATH $RPATH" go build -tags xtengine \
            -ldflags="-s -w -X main.version=${{ github.ref_name || github.event.inputs.version }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -trimpath \
            -o gateway-server${{ matrix.ext }} \
            ./cmd/server
          case "${{ runner.os }}" in
            Windows)
              cp engine_lib/xt_matching.dll .
              for runtime in libgcc_s_seh-1.dll libwinpthread-1.dll libstdc++-6.dll; do
                runtime_path="$(gcc -print-file-name="$runtime")"
                if [ -f "$runtime_path" ]; then cp "$runtime_path" .; fi
              done
              ;;
            macOS) cp engine_lib/libxt_matching.dylib . ;;
            Linux) cp engine_lib/libxt_matching.so . ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ matrix.name }}
          path: |
            gateway/gateway-server${{ matrix.ext }}
            gateway/libxt_matching.so
            gateway/libxt_matching.dylib
            gateway/xt_matching.dll
            gateway/libgcc_s_seh-1.dll
            gateway/libwinpthread-1.dll
            gateway/libstdc++-6.dll

  # ── Package Release ──
  package:
    needs: [build-gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package releases
        run: |
          VERSION="${{ github.ref_name || github.event.inputs.version }}"
          mkdir -p releases
          for dir in artifacts/gateway-*; do
            name=$(basename "$dir")
            platform=${name#gateway-}
            mkdir -p "tmp/${platform}"
            # Gateway executable and matching-engine runtime library
            for file in "${dir}"/gateway-server* "${dir}"/libxt_matching.so "${dir}"/libxt_matching.dylib "${dir}"/xt_matching.dll "${dir}"/libgcc_s_seh-1.dll "${dir}"/libwinpthread-1.dll "${dir}"/libstdc++-6.dll; do
              if [[ -f "$file" ]]; then cp "$file" "tmp/${platform}/"; fi
            done
            # Frontend
            mkdir -p "tmp/${platform}/spa"
            cp -r artifacts/web-dist/* "tmp/${platform}/spa/" 2>/dev/null || true
            # Python ML Server
            mkdir -p "tmp/${platform}/sandbox/ml_server"
            cp -r sandbox/ml_server/* "tmp/${platform}/sandbox/ml_server/" 2>/dev/null || true
            # Config
            mkdir -p "tmp/${platform}/config"
            cp config/*.yaml "tmp/${platform}/config/" 2>/dev/null || true
            # Start scripts
            cp install.sh "tmp/${platform}/" 2>/dev/null || true
            cp install.ps1 "tmp/${platform}/" 2>/dev/null || true
            cp start.sh "tmp/${platform}/" 2>/dev/null || true
            # Create archive
            cd "tmp/${platform}"
            if [[ "$platform" == windows-* ]]; then
              zip -r "../../releases/xiaotianquant-${VERSION}-${platform}.zip" .
            else
              tar czf "../../releases/xiaotianquant-${VERSION}-${platform}.tar.gz" .
            fi
            cd ../..
          done
          ls -la releases/
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: ${{ github.ref_name || github.event.inputs.version }}
          files: releases/*
          draft: false
          prerelease: false
          generate_release_notes: true

  # ── Electron Desktop（安装包：linux AppImage+deb / win nsis / mac dmg）──
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            patterns: |
              web/release/*.AppImage
              web/release/*.deb
          - os: windows-latest
            name: win
            patterns: |
              web/release/*.exe
          # dmg 只能在 macOS runner 上产出（未签名；公证需另行配置证书）。
          - os: macos-latest
            name: mac
            patterns: |
              web/release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'
      - name: Install & build web
        working-directory: ./web
        run: |
          npm ci
          npm run build
      - name: Pack Electron installers
        working-directory: ./web
        env:
          ELECTRON_MIRROR: 'https://npmmirror.com/mirrors/electron/'
          # 未配置签名证书：跳过 mac 公证/签名与 win 签名，产出未签名安装包。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run electron:dist
      - uses: actions/upload-artifact@v4
        with:
          name: xiaotian-desktop-${{ matrix.name }}
          path: ${{ matrix.patterns }}
          if-no-files-found: error
