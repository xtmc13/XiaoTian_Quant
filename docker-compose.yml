version: "3.9"

# ═══════════════════════════════════════════════════════════════════
# XiaoTianQuant v3.0 — Development Compose
# 可选监控栈（Grafana + Prometheus）：
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d
# 详见 docs/OBSERVABILITY.md
# ═══════════════════════════════════════════════════════════════════

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: xiaotian-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=release
      - DB_PATH=/app/data/gateway.db
      - SECRET_KEY=${SECRET_KEY}
      - ML_SERVER_URL=http://sandbox:8001
      - SANDBOX_URL=http://sandbox:9000
      - CCXT_BRIDGE_URL=http://sandbox:8002
      - PYTHON_STRATEGY_URL=http://sandbox:8003
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      # API 文档（Swagger UI，默认开启；规范无敏感数据，生产可用 nginx 加访问控制）
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-true}
      # Exchange API keys
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - OKX_API_KEY=${OKX_API_KEY:-}
      - OKX_API_SECRET=${OKX_API_SECRET:-}
      # AI provider keys
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Notification channels (optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TO=${SMTP_TO:-}
      - LARK_WEBHOOK=${LARK_WEBHOOK:-}
      - LARK_SIGNING_KEY=${LARK_SIGNING_KEY:-}
      - DINGTALK_WEBHOOK=${DINGTALK_WEBHOOK:-}
      - DINGTALK_SECRET=${DINGTALK_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Alertmanager 告警 webhook 共享密钥（/api/alerts/webhook 校验，空则该端点 503）
      - ALERT_WEBHOOK_SECRET=${ALERT_WEBHOOK_SECRET:-}
      # Cache (optional Redis)
      - CACHE_ENABLED=${CACHE_ENABLED:-false}
      - REDIS_URL=${REDIS_URL:-}
      # Discord (optional)
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_PUBLIC_KEY=${DISCORD_PUBLIC_KEY:-}
    volumes:
      - gateway_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - xiaotian
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: xiaotian-sandbox
    expose:
      - "9000"
    environment:
      - SANDBOX_PORT=9000
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - xiaotian
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: xiaotian-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - xiaotian
    profiles:
      - cache
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qqbot-connector:
    build:
      context: ./qqbot-connector
    container_name: xiaotian-qqbot-connector
    environment:
      - PORT=8787
      - DATA_DIR=/data
      # 扫码页「第三方机器人」展示名（留空用 SDK 默认）
      - QQ_CONNECTOR_SOURCE=${QQ_CONNECTOR_SOURCE:-}
    volumes:
      # 与 gateway 共享数据卷：凭据落盘持久化，重建容器不丢
      - gateway_data:/data
    restart: unless-stopped
    networks:
      - xiaotian

volumes:
  gateway_data:
  redis_data:

networks:
  xiaotian:
    driver: bridge
