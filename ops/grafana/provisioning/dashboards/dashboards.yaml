# ═══════════════════════════════════════════════════════════════════
# XiaoTian Quant — Grafana 看板 provisioning
# 自动加载 ops/grafana/dashboards/ 下的所有看板 JSON。
# ═══════════════════════════════════════════════════════════════════

apiVersion: 1

providers:
  - name: xiaotian
    orgId: 1
    folder: "XiaoTian Quant"
    folderUid: xiaotian
    type: file
    disableDeletion: false
    # 看板文件变更后自动重新加载（秒）
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
