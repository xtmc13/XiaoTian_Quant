# ═══════════════════════════════════════════════════════════════════
# XiaoTianQuant Runtime Configuration (NON-SECRET ONLY)
# ═══════════════════════════════════════════════════════════════════
#
# This file contains non-sensitive application configuration.
# NEVER put API keys, secrets, passphrases, or JWT secrets here.
# All credentials must be provided via environment variables / .env only.

# Default exchange and exchange-specific non-secret settings.
exchanges:
  binance:
    enabled: false
    testnet: true
    futures: false
  okx:
    enabled: false
    testnet: true
    futures: false
  bybit:
    enabled: false
    testnet: true
    futures: false
  gate:
    enabled: false
    testnet: true
    futures: false
  # IBKR（Interactive Brokers）本地 Client Portal Web API 网关。
  # 需自行运行 IB Gateway 或 Client Portal（默认 https://localhost:5000），
  # 浏览器登录一次后会话 cookie 即认证；无 API key/secret。
  ibkr:
    enabled: false        # 启用 IBKR 适配器
    host: localhost       # Client Portal 网关地址
    port: 5000            # Client Portal 网关端口
    account_id: ""        # 账户 id（如 DU123456）；留空自动取第一个账户
    paper_host: ""        # paper 网关地址，默认同 host（指向 paper 账户端口）
    paper_port: 0         # paper 网关端口，默认同 port
    paper: false          # true 时下单/撤单/订单查询走 paper 网关
    ca_cert: ""           # 自签根证书 PEM 路径；留空 = InsecureSkipVerify

# AI / LLM provider non-secret settings.
ai_providers:
  deepseek:
    enabled: false
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
  openai:
    enabled: false
    model: gpt-4o
    base_url: https://api.openai.com/v1
  claude:
    enabled: false
    model: claude-opus-4-7
    base_url: https://api.anthropic.com/v1

# Arbitrage engine settings.
arbitrage:
  enabled: false
  dry_run: true
  min_spread_pct: 0.05
  max_position_usdt: 1000

# Triangular arbitrage engine settings.
triangular:
  enabled: false
  dry_run: true
  min_profit_pct: 0.03

# UI preferences (non-sensitive).
ui:
  theme: dark
  language: zh-CN

# 风控参数（网关启动时由 risk manager 读取；运行时可由 admin 调
# PUT /api/risk/config 调整，该接口限定 1-100）。
# position_limit_pct：单笔订单名义价值占账户总权益的比例上限（%）。
#   ≤100 为实盘安全值；>100 是 paper 模拟盘放宽值（历史事故值 2500），
#   会使仓位风控形同虚设——启动仅打 WARN 不拦截（paper 环境可用），
#   但 /trading/unlock 实盘解锁将被硬拒绝，除非显式设置环境变量
#   XIAOTIAN_ALLOW_RELAXED_RISK=1。开实盘前必须回调到 ≤100。
risk:
  position_limit_pct: 50

# Default selections.
default_exchange: binance
default_ai_provider: deepseek
